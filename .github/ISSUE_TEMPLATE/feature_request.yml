name: Feature request
description: Suggest a provider, workflow, or product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What update-tracking problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Canonical sources
      description: Link vendor documentation or public feeds if this concerns an update provider.
